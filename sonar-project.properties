# ============================================================
# Configuração do SonarQube / SonarCloud para o FinanceFlow
# Executar a partir da RAIZ do projeto:
#   1) cd backend && npm run test:coverage   (gera coverage/lcov.info)
#   2) sonar-scanner                          (lê este arquivo)
# ============================================================

sonar.projectKey=financeflow_key
sonar.projectName=FinanceFlow
sonar.projectVersion=1.0

# Código-fonte analisado (backend + frontend)
sonar.sources=backend/src,frontend/src

# Código de testes
sonar.tests=backend/tests,frontend/cypress

# Relatório de cobertura (LCOV) — backend (Jest) e frontend (Vitest)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Arquivos ignorados pela análise / cobertura
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.config.ts,**/*.config.js
sonar.coverage.exclusions=**/tests/**,**/cypress/**,backend/src/seed.ts,backend/src/prisma.ts,backend/src/server.ts,**/*.routes.ts

# Codificação dos fontes
sonar.sourceEncoding=UTF-8
